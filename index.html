<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIA 管理中心</title>
<style>
:root{
  --bg:#081526;
  --bg2:#0e223a;
  --panel:rgba(20,42,67,.72);
  --panel-strong:rgba(17,36,58,.9);
  --text:#eef6ff;
  --muted:#9fb4cb;
  --border:rgba(154,194,255,.16);
  --accent:#5b8cff;
  --accent2:#5ce1e6;
  --success:#44d7b6;
  --warn:#f1bb55;
  --danger:#ff6b7d;
  --shadow:0 18px 48px rgba(0,0,0,.25);
}
body.light{
  --bg:#edf5ff;
  --bg2:#dfeafb;
  --panel:rgba(255,255,255,.68);
  --panel-strong:rgba(255,255,255,.9);
  --text:#102441;
  --muted:#6e8198;
  --border:rgba(76,118,170,.14);
  --shadow:0 18px 48px rgba(74,101,140,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
body{
  color:var(--text);
  background:
    radial-gradient(circle at 18% 18%,rgba(80,126,255,.22),transparent 26%),
    radial-gradient(circle at 82% 12%,rgba(92,225,230,.10),transparent 22%),
    linear-gradient(135deg,var(--bg),var(--bg2));
  transition:.3s ease;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.icon{
  width:18px;
  height:18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 18px;
}
.icon svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* LOGIN */
.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:32px;
  position:relative;
  overflow:hidden;
}
.login-wrap:before,.login-wrap:after{
  content:"";
  position:absolute;
  width:420px;height:420px;border-radius:50%;
  filter:blur(60px);opacity:.22;
}
.login-wrap:before{background:#567cff;left:-120px;top:-80px}
.login-wrap:after{background:#5ce1e6;right:-100px;bottom:-120px}
.login-card{
  width:min(460px,100%);
  padding:48px 42px;
  border:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-radius:30px;
  box-shadow:var(--shadow);
  position:relative;
  z-index:1;
}
.brand{
  text-align:center;
  margin-bottom:38px;
}
.brand .logo{
  font-size:64px;
  line-height:1;
  font-weight:800;
  letter-spacing:.15em;
  margin-left:.15em;
  background:linear-gradient(135deg,#ffffff 10%,#8eb8ff 50%,#6fe5ef);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
body.light .brand .logo{
  background:linear-gradient(135deg,#2457b8,#5f84ef,#4dbdc7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .sub{margin-top:16px;letter-spacing:.28em;color:var(--muted);font-size:15px}
.field{
  display:flex;align-items:center;gap:12px;
  margin-top:14px;
  padding:0 16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.035);
  border-radius:14px;
}
.login-field-icon{
  width:18px;
  height:18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  flex:0 0 18px;
}
.login-field-icon svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.field input{
  width:100%;height:52px;background:transparent;border:0;outline:0;color:var(--text);
}
.field input::placeholder{color:var(--muted)}
.login-btn{
  width:100%;height:54px;border:0;border-radius:15px;margin-top:22px;
  color:white;font-weight:700;font-size:16px;
  background:linear-gradient(90deg,var(--accent),#4969ee,var(--accent2));
  box-shadow:0 10px 28px rgba(64,106,255,.28);
}
.login-error{min-height:22px;margin-top:10px;text-align:center;color:var(--danger);font-size:13px}

/* APP */
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:250px 1fr;
}
.sidebar{
  position:sticky;top:0;height:100vh;padding:26px 18px;
  border-right:1px solid var(--border);
  background:rgba(8,22,38,.56);
  backdrop-filter:blur(22px);
}
body.light .sidebar{background:rgba(239,246,255,.68)}
.side-brand{padding:4px 14px 28px}
.side-brand strong{font-size:34px;letter-spacing:.12em}
.side-brand div{margin-top:8px;color:var(--muted);font-size:13px}
.nav{display:grid;gap:8px}
.nav-item{
  width:100%;border:1px solid transparent;background:transparent;color:var(--muted);
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{
  color:white;border-color:rgba(132,170,255,.35);
  background:linear-gradient(90deg,rgba(74,112,255,.82),rgba(76,99,232,.56));
  box-shadow:0 8px 24px rgba(47,84,224,.22);
}
body.light .nav-item.active{color:white}
.nav-item.disabled{opacity:.45;cursor:default}
.side-user{
  position:absolute;left:18px;right:18px;bottom:22px;
  padding:13px;border:1px solid var(--border);border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;background:var(--panel);
}
.avatar{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#3356c8);color:#fff;font-weight:700
}
.user-meta{flex:1;margin-left:10px}
.user-meta strong{display:block;font-size:14px}
.user-meta span{font-size:11px;color:var(--muted)}

.main{padding:24px 28px 36px;min-width:0}
.utility-bar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
}
.theme-toggle{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  padding:5px;
  display:flex;
  gap:4px;
}
.theme-toggle button{
  border:0;
  border-radius:8px;
  padding:6px 10px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  line-height:1;
}
.theme-toggle button.on{background:linear-gradient(135deg,var(--accent),#385be7);color:white}
.logout{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:10px;
  padding:8px 12px;
  font-size:13px;
  line-height:1;
}
.section-title{
  font-size:16px;
  color:var(--muted);
  margin:0 0 14px 2px;
}

.cards{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px
}
.card{
  border:1px solid var(--border);background:var(--panel);
  backdrop-filter:blur(18px);border-radius:18px;padding:18px;box-shadow:var(--shadow)
}
.kpi-label{color:var(--muted);font-size:13px}
.kpi-value{font-size:27px;font-weight:800;margin:7px 0 6px}
.kpi-foot{font-size:12px;color:var(--success)}

.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
.panel{
  border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:18px;
  box-shadow:var(--shadow)
}
.panel h3{margin:0 0 16px;font-size:16px}
.trend-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.trend-legend{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--muted);
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
}
.legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}
.legend-reconcile{background:#5b8cff}
.legend-adjust{background:#44d7b6}
.chart{
  height:260px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:10px 0 0;
}
.chart svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}
.chart-grid{
  stroke:var(--border);
  stroke-width:1;
}
.chart-axis-text{
  fill:var(--muted);
  font-size:11px;
}
.chart-line-reconcile{
  fill:none;
  stroke:#5b8cff;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.chart-line-adjust{
  fill:none;
  stroke:#44d7b6;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.chart-point-reconcile{
  fill:#5b8cff;
  stroke:var(--panel-strong);
  stroke-width:2;
}
.chart-point-adjust{
  fill:#44d7b6;
  stroke:var(--panel-strong);
  stroke-width:2;
}
.donut-wrap{display:grid;place-items:center;height:230px}
.donut{
  width:150px;height:150px;border-radius:50%;
  background:conic-gradient(var(--accent) 0 98.3%,var(--warn) 98.3% 99.6%,var(--danger) 99.6% 100%);
  display:grid;place-items:center
}
.donut:before{
  content:"98.3%\A已核對";white-space:pre;text-align:center;
  width:108px;height:108px;border-radius:50%;display:grid;place-items:center;
  background:var(--panel-strong);color:var(--text);font-weight:800;line-height:1.4
}

.table-panel{margin-top:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:13px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{color:var(--muted);font-weight:600}
.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}
.ok{background:rgba(68,215,182,.13);color:var(--success)}
.wait{background:rgba(241,187,85,.13);color:var(--warn)}

@media(max-width:980px){
  .app{grid-template-columns:84px 1fr}
  .sidebar{padding:24px 12px}
  .side-brand div,.nav-item span,.user-meta{display:none}
  .side-brand{padding-left:7px}
  .side-brand strong{font-size:24px}
  .nav-item{justify-content:center;padding:13px 8px}
  .side-user{justify-content:center}
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .main{padding:18px 14px 28px}
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;z-index:10;left:0;right:0;bottom:0;top:auto;height:auto;
    display:flex;align-items:center;padding:8px 10px;border-right:0;border-top:1px solid var(--border)
  }
  .side-brand,.side-user{display:none}
  .nav{width:100%;grid-template-columns:repeat(5,1fr)}
  .nav-item{font-size:11px}
  .nav-item span{display:none}
  .main{padding-bottom:92px}
  .utility-bar{justify-content:space-between}
  .cards{grid-template-columns:1fr 1fr}
  .kpi-value{font-size:21px}
  .theme-toggle button{padding:6px 8px;font-size:12px}
  .logout{padding:8px 10px;font-size:12px}
}

.placeholder-page{
  margin-top:14px;
  min-height:460px;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:18px;
  box-shadow:var(--shadow);
}


.empty-status{
  height:230px;
}


.finance-frame-wrap{
  width:100%;
  margin-top:-6px;
  height:calc(100vh - 54px);
  min-height:720px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  box-shadow:0 20px 60px rgba(0,0,0,.18);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.finance-frame-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:transparent;
}
</style>
</head>
<body>
<section id="appPage" class="app">
  <aside class="sidebar">
    <div class="side-brand">
      <strong>VIA</strong>
      <div>管理中心</div>
    </div>

    <nav class="nav">
      <button class="nav-item active" onclick="showPage('home', this)">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3.5 10.5 12 3l8.5 7.5"></path>
            <path d="M5.5 9.5V21h13V9.5"></path>
            <path d="M9.5 21v-6h5v6"></path>
          </svg>
        </span>
        <span>首頁</span>
      </button>

      <button class="nav-item" onclick="showPage('balance', this)">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <ellipse cx="12" cy="6" rx="6.5" ry="3"></ellipse>
            <path d="M5.5 6v4c0 1.7 2.9 3 6.5 3s6.5-1.3 6.5-3V6"></path>
            <path d="M5.5 10v4c0 1.7 2.9 3 6.5 3s6.5-1.3 6.5-3v-4"></path>
            <path d="M5.5 14v4c0 1.7 2.9 3 6.5 3s6.5-1.3 6.5-3v-4"></path>
          </svg>
        </span>
        <span>財務核對餘額</span>
      </button>

      <button class="nav-item disabled">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3.5 7.5h6l2 2h9v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path>
            <path d="M3.5 7.5v-1a2 2 0 0 1 2-2h4l2 2h4"></path>
          </svg>
        </span>
        <span>功能 3</span>
      </button>

      <button class="nav-item disabled">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v4"></path>
            <path d="M12 17v4"></path>
            <path d="M4.9 4.9l2.8 2.8"></path>
            <path d="M16.3 16.3l2.8 2.8"></path>
            <path d="M3 12h4"></path>
            <path d="M17 12h4"></path>
            <path d="M4.9 19.1l2.8-2.8"></path>
            <path d="M16.3 7.7l2.8-2.8"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </span>
        <span>功能 4</span>
      </button>

      <button class="nav-item disabled">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z"></path>
            <path d="M12 3v2.2"></path>
            <path d="M12 18.8V21"></path>
            <path d="M3 12h2.2"></path>
            <path d="M18.8 12H21"></path>
            <path d="M5.7 5.7l1.5 1.5"></path>
            <path d="M16.8 16.8l1.5 1.5"></path>
            <path d="M5.7 18.3l1.5-1.5"></path>
            <path d="M16.8 7.2l1.5-1.5"></path>
          </svg>
        </span>
        <span>系統設定</span>
      </button>
    </nav>

    <div class="side-user">
      <div class="avatar">A</div>
      <div class="user-meta"><strong>Admin</strong><span>管理員</span></div>
      <span>›</span>
    </div>
  </aside>

  <main class="main">
    <div class="utility-bar">
      <div class="theme-toggle">
        <button id="lightBtn" onclick="setTheme('light')">☀ 淺色</button>
        <button id="darkBtn" onclick="setTheme('dark')" class="on">☾ 深色</button>
      </div>
      <button class="logout" onclick="logout()">登出</button>
    </div>

    <section id="homePage">
    <p class="section-title">財務核對餘額</p>

    <div class="cards">
      <div class="card">
        <div class="kpi-label">核對平台數</div>
        <div class="kpi-value" id="totalReconcilePlatforms">0</div>
        <div class="kpi-foot">每查詢 1 個平台 +1</div>
      </div>
      <div class="card">
        <div class="kpi-label">當日核對平台數</div>
        <div class="kpi-value" id="todayReconcilePlatforms">0</div>
        <div class="kpi-foot">每日 00:00 刷新</div>
      </div>
      <div class="card">
        <div class="kpi-label">補帳數</div>
        <div class="kpi-value" id="totalAdjustments">0</div>
        <div class="kpi-foot">每補帳 1 次 +1</div>
      </div>
      <div class="card">
        <div class="kpi-label">當日補帳數</div>
        <div class="kpi-value" id="todayAdjustments">0</div>
        <div class="kpi-foot">每日 00:00 刷新</div>
      </div>
    </div>

    <div class="grid2">
      <div class="panel">
        <div class="trend-head">
          <h3 style="margin:0">核對趨勢</h3>
          <div class="trend-legend">
            <span class="legend-item"><span class="legend-dot legend-reconcile"></span>當日核對平台數</span>
            <span class="legend-item"><span class="legend-dot legend-adjust"></span>當日補帳數</span>
          </div>
        </div>
        <div class="chart">
          <svg id="trendChart" viewBox="0 0 760 250" preserveAspectRatio="none" aria-label="最近7日核對趨勢"></svg>
        </div>
      </div>
      <div class="panel">
        <h3>核對狀態</h3>
        <div class="empty-status"></div>
      </div>
    </div>

    <div class="panel table-panel">
      <h3>最近重啟記錄</h3>
      <table>
        <thead>
          <tr><th>重啟時間</th><th>狀態</th></tr>
        </thead>
        <tbody id="restartRecordBody">
          <tr>
            <td id="lastRestartTime">—</td>
            <td><span class="status wait" id="lastRestartStatus">尚無記錄</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    </section>

    <section id="balancePage" class="hidden">
      <div class="finance-frame-wrap">
        <iframe id="financeBalanceFrame" title="財務核對餘額"></iframe>
      </div>
    </section>
  </main>
</section>

<script>
const appPage = document.getElementById('appPage');

function applySavedTheme(){
  const saved = localStorage.getItem('via-theme') || 'dark';
  setTheme(saved);
}
function setTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  localStorage.setItem('via-theme', theme);
  const l = document.getElementById('lightBtn');
  const d = document.getElementById('darkBtn');
  if(l && d){
    l.classList.toggle('on', theme === 'light');
    d.classList.toggle('on', theme === 'dark');
  }
}

function logout(){
  window.location.href = '/logout';
}

function showPage(page, btn){
  const home = document.getElementById('homePage');
  const balance = document.getElementById('balancePage');
  if(home) home.classList.toggle('hidden', page !== 'home');
  if(balance) balance.classList.toggle('hidden', page !== 'balance');

  if(page === 'balance'){
    loadFinancePage();
  }

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function viaDateKey(date = new Date()){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function getHistory(){
  try{
    return JSON.parse(localStorage.getItem('via-daily-history') || '{}');
  }catch(e){
    return {};
  }
}

function saveHistory(history){
  localStorage.setItem('via-daily-history', JSON.stringify(history));
}

function ensureTodayHistory(){
  const today = viaDateKey();
  const history = getHistory();

  if(!history[today]){
    history[today] = { reconcile:0, adjustments:0 };
    saveHistory(history);
  }

  localStorage.setItem('via-counter-day', today);
  localStorage.setItem('via-today-reconcile-platforms', String(history[today].reconcile || 0));
  localStorage.setItem('via-today-adjustments', String(history[today].adjustments || 0));
  return history;
}

function initViaCounters(){
  if(localStorage.getItem('via-total-reconcile-platforms') === null){
    localStorage.setItem('via-total-reconcile-platforms', '0');
  }
  if(localStorage.getItem('via-total-adjustments') === null){
    localStorage.setItem('via-total-adjustments', '0');
  }

  ensureTodayHistory();
  renderViaCounters();
}

function renderViaCounters(){
  const history = ensureTodayHistory();
  const today = viaDateKey();
  const todayData = history[today] || {reconcile:0, adjustments:0};

  const totalReconcile = Number(localStorage.getItem('via-total-reconcile-platforms') || 0);
  const totalAdjustments = Number(localStorage.getItem('via-total-adjustments') || 0);

  const a = document.getElementById('totalReconcilePlatforms');
  const b = document.getElementById('todayReconcilePlatforms');
  const c = document.getElementById('totalAdjustments');
  const d = document.getElementById('todayAdjustments');

  if(a) a.textContent = totalReconcile.toLocaleString();
  if(b) b.textContent = Number(todayData.reconcile || 0).toLocaleString();
  if(c) c.textContent = totalAdjustments.toLocaleString();
  if(d) d.textContent = Number(todayData.adjustments || 0).toLocaleString();

  renderTrendChart();
}

/*
  財務核對餘額接入時：
  - 查詢平台後呼叫 addReconcilePlatforms(查詢平台數)
    例如 TD + XY + OL => addReconcilePlatforms(3)
  - 補帳成功後呼叫 addAdjustment()
*/
function addReconcilePlatforms(count){
  const n = Math.max(0, Number(count) || 0);
  if(!n) return;

  const history = ensureTodayHistory();
  const today = viaDateKey();

  history[today].reconcile = Number(history[today].reconcile || 0) + n;
  saveHistory(history);

  localStorage.setItem(
    'via-total-reconcile-platforms',
    String(Number(localStorage.getItem('via-total-reconcile-platforms') || 0) + n)
  );

  localStorage.setItem('via-today-reconcile-platforms', String(history[today].reconcile));
  renderViaCounters();
}

function addAdjustment(){
  const history = ensureTodayHistory();
  const today = viaDateKey();

  history[today].adjustments = Number(history[today].adjustments || 0) + 1;
  saveHistory(history);

  localStorage.setItem(
    'via-total-adjustments',
    String(Number(localStorage.getItem('via-total-adjustments') || 0) + 1)
  );

  localStorage.setItem('via-today-adjustments', String(history[today].adjustments));
  renderViaCounters();
}

function getLast7Days(){
  const result = [];
  const today = new Date();

  for(let i=6;i>=0;i--){
    const d = new Date(today);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate()-i);
    result.push({
      key: viaDateKey(d),
      label: `${d.getMonth()+1}/${d.getDate()}`
    });
  }
  return result;
}

function renderTrendChart(){
  const svg = document.getElementById('trendChart');
  if(!svg) return;

  const history = getHistory();
  const days = getLast7Days();
  const reconcile = days.map(d => Number(history[d.key]?.reconcile || 0));
  const adjustments = days.map(d => Number(history[d.key]?.adjustments || 0));

  const maxRaw = Math.max(1, ...reconcile, ...adjustments);
  const maxVal = Math.max(5, Math.ceil(maxRaw / 5) * 5);

  const W = 760, H = 250;
  const left = 48, right = 18, top = 18, bottom = 38;
  const plotW = W - left - right;
  const plotH = H - top - bottom;

  const x = i => left + (plotW * i / Math.max(1, days.length - 1));
  const y = v => top + plotH - (v / maxVal) * plotH;

  const polyline = arr => arr.map((v,i)=>`${x(i)},${y(v)}`).join(' ');

  let out = '';

  const gridSteps = 4;
  for(let i=0;i<=gridSteps;i++){
    const value = Math.round(maxVal * (gridSteps-i) / gridSteps);
    const gy = top + (plotH * i / gridSteps);
    out += `<line class="chart-grid" x1="${left}" y1="${gy}" x2="${W-right}" y2="${gy}"></line>`;
    out += `<text class="chart-axis-text" x="${left-10}" y="${gy+4}" text-anchor="end">${value}</text>`;
  }

  days.forEach((d,i)=>{
    out += `<text class="chart-axis-text" x="${x(i)}" y="${H-10}" text-anchor="middle">${d.label}</text>`;
  });

  out += `<polyline class="chart-line-reconcile" points="${polyline(reconcile)}"></polyline>`;
  out += `<polyline class="chart-line-adjust" points="${polyline(adjustments)}"></polyline>`;

  reconcile.forEach((v,i)=>{
    out += `<circle class="chart-point-reconcile" cx="${x(i)}" cy="${y(v)}" r="4">
      <title>${days[i].label} 當日核對平台數：${v}</title>
    </circle>`;
  });

  adjustments.forEach((v,i)=>{
    out += `<circle class="chart-point-adjust" cx="${x(i)}" cy="${y(v)}" r="4">
      <title>${days[i].label} 當日補帳數：${v}</title>
    </circle>`;
  });

  svg.innerHTML = out;
}


function setLastRestartRecord(timeText, statusText='已重啟'){
  localStorage.setItem('via-last-restart-time', timeText || '');
  localStorage.setItem('via-last-restart-status', statusText || '已重啟');
  renderLastRestartRecord();
}

function renderLastRestartRecord(){
  const time = localStorage.getItem('via-last-restart-time') || '';
  const status = localStorage.getItem('via-last-restart-status') || '';

  const timeEl = document.getElementById('lastRestartTime');
  const statusEl = document.getElementById('lastRestartStatus');

  if(!timeEl || !statusEl) return;

  if(time){
    timeEl.textContent = time;
    statusEl.textContent = status || '已重啟';
    statusEl.classList.remove('wait');
    statusEl.classList.add('ok');
  }else{
    timeEl.textContent = '—';
    statusEl.textContent = '尚無記錄';
    statusEl.classList.remove('ok');
    statusEl.classList.add('wait');
  }
}

function loadFinancePage(){
  const frame = document.getElementById('financeBalanceFrame');
  if(!frame || frame.dataset.loaded === '1') return;
  try {
    const binary = atob(FINANCE_HTML_BASE64);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    frame.srcdoc = new TextDecoder('utf-8').decode(bytes);
    frame.dataset.loaded = '1';
  } catch(err) {
    console.error('財務核對餘額載入失敗', err);
  }
}

window.addEventListener('message', (event) => {
  const data = event.data || {};
  if(data.source !== 'VIA_FINANCE') return;

  if(data.type === 'reconcile-platforms') {
    addReconcilePlatforms(Number(data.count || 0));
  }

  if(data.type === 'adjustment-success') {
    addAdjustment();
  }

  if(data.type === 'restart-success') {
    setLastRestartRecord(data.time || new Date().toLocaleString('zh-TW', {hour12:false}), '已重啟');
  }
});



// 預先載入財務核對餘額頁，避免第一次切換時只看到空白。
setTimeout(loadFinancePage, 0);
applySavedTheme();
initViaCounters();
renderLastRestartRecord();

</script>
