<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豬朋狗友</title>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --bubble: #eff6ff;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px;
    }

    header {
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 8px 0;
    }

    .tab-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .panel.active {
      display: block;
    }

    .robot-status-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f9fafb;
      padding: 5px 7px;
      margin-bottom: 5px;
    }

    .robot-status-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .robot-status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
      overflow-x: auto;
      min-width: 0;
      flex: 1 1 auto;
    }

    .robot-status-main {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text);
      font-weight: 700;
      flex: 0 0 auto;
    }

    .robot-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--warning);
      flex: 0 0 auto;
    }

    .robot-dot.online {
      background: var(--success);
    }

    .robot-dot.offline {
      background: var(--danger);
    }

    .robot-status-detail {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .chat-window {
      height: 73vh;
      min-height: 620px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f9fafb;
      padding: 8px;
      margin-bottom: 6px;
    }

    .empty-chat {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      font-size: 13px;
    }

    .message-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 8px;
      margin-bottom: 7px;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.03);
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .message-id {
      color: var(--muted);
      font-size: 10px;
    }

    .message-time {
      color: var(--muted);
      font-size: 10px;
      text-align: right;
    }

    .message-text {
      background: var(--bubble);
      border: 1px solid #bfdbfe;
      border-radius: 9px;
      padding: 6px 8px;
      line-height: 1.42;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .message-status-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 0;
      padding: 3px 7px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      max-width: 100%;
      line-height: 1.4;
      flex: 0 1 auto;
      white-space: pre-wrap;
    }

    .status-waiting {
      background: var(--warning);
    }

    .status-processing {
      background: var(--warning);
    }

    .status-done {
      background: var(--success);
    }

    .status-error {
      background: var(--danger);
    }

    .chat-input-area {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: stretch;
    }

    .input-button-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: flex-start;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      max-height: 240px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 13px;
      line-height: 1.42;
      resize: vertical;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    button.action {
      border: 0;
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 13px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    button.danger {
      background: var(--danger);
    }

    .empty-box {
      min-height: 660px;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: #f9fafb;
      text-align: center;
      line-height: 1.6;
      padding: 20px;
      font-size: 13px;
    }

    .status {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .app {
        padding: 6px;
      }

      h1 {
        font-size: 16px;
      }

      .tabs {
        grid-template-columns: 1fr;
        margin: 6px 0;
      }

      .robot-status-toolbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .robot-status-line {
        white-space: normal;
        flex-wrap: wrap;
      }

      .chat-window {
        height: 68vh;
        min-height: 500px;
      }

      .chat-input-area {
        grid-template-columns: 1fr;
      }

      .input-button-stack {
        flex-direction: row;
        justify-content: flex-end;
      }

      .message-header {
        flex-direction: column;
        gap: 2px;
      }

      .message-time {
        text-align: left;
      }

      .message-status-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }
    }

    .page2-iframe {
      width: 100%;
      height: 82vh;
      min-height: 760px;
      border: 0;
      border-radius: 10px;
      background: #f4f5f7;
      display: block;
    }

    @media (max-width: 640px) {
      .page2-iframe {
        height: 82vh;
        min-height: 620px;
      }
    }

  </style>

  <style id="force-dog-full-width">
    /* 小狗分頁：上方標題/按鈕維持原本大小；小狗內容框從左側 97px 開始 */
    body.dog-page-active {
      overflow-x: hidden;
    }

    body.dog-page-active .app {
      max-width: 960px !important;
      width: auto !important;
      margin: 0 auto !important;
      padding: 8px !important;
    }

    body.dog-page-active header {
      display: block !important;
      margin-bottom: 6px !important;
    }

    body.dog-page-active .tabs {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 6px !important;
      margin: 8px 0 !important;
      padding: 0 !important;
      width: 100% !important;
    }

    /*
      小狗下面的內容框不要貼著瀏覽器左邊。
      框左側固定從 viewport 的 97px 開始，右側延伸到瀏覽器右邊。
    */
    body.dog-page-active #tab-page2 {
      width: calc(100vw - 97px) !important;
      max-width: none !important;
      margin-left: calc(97px - ((100vw - 960px) / 2)) !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    body.dog-page-active #page2Frame {
      width: 100% !important;
      max-width: none !important;
      height: calc(100vh - 92px) !important;
      min-height: 820px !important;
      border: 0 !important;
      border-radius: 0 !important;
      display: block !important;
      background: #f4f5f7 !important;
    }

    @media (max-width: 960px) {
      body.dog-page-active .app {
        max-width: none !important;
        width: 100% !important;
        padding: 6px !important;
      }

      body.dog-page-active #tab-page2 {
        width: calc(100vw - 12px) !important;
        margin-left: 6px !important;
      }

      body.dog-page-active #page2Frame {
        width: 100% !important;
        height: calc(100vh - 88px) !important;
        min-height: 680px !important;
      }
    }

    @media (max-width: 640px) {
      body.dog-page-active .tabs {
        grid-template-columns: 1fr !important;
        margin: 6px 0 !important;
      }

      body.dog-page-active #tab-page2 {
        width: calc(100vw - 12px) !important;
        margin-left: 6px !important;
      }
    }
  </style>

</head>

<body>
  <main class="app">
    <header>
      <h1>豬朋狗友</h1>
    </header>

    <nav class="tabs" aria-label="页面分页">
      <button class="tab-btn active" data-tab="page1">小猪</button>
      <button class="tab-btn" data-tab="page2">小狗</button>
      <button class="tab-btn" data-tab="page3">敬请期待</button>
    </nav>

    <section id="tab-page1" class="panel active">
      <div class="robot-status-card">
        <div class="robot-status-toolbar">
          <div class="robot-status-line">
            <span class="robot-status-main">
              <span id="robotStatusDot" class="robot-dot offline"></span>
              <span id="robotStatusText">小猪：离线</span>
            </span>

            <span id="robotStatusDetail" class="robot-status-detail">
              尚未收到机器人上线回报。
            </span>
          </div>
        </div>
      </div>

      <div id="chatWindow" class="chat-window" aria-label="对话内容显示区"></div>

      <div class="chat-input-area">
        <textarea
          id="messageInput"
          placeholder="必要有「转」「到」&#10;例一：&#10;A 转 10 到 B&#10;例二：&#10;A 转 10&#10;B 转 10 到 C"
        ></textarea>

        <div class="input-button-stack">
          <button class="action danger" onclick="clearMessages()">清空对话</button>
          <button class="action" onclick="sendMessage()">送出</button>
        </div>
      </div>

      <div class="status" id="page1Status"></div>
    </section>

    <section id="tab-page2" class="panel">
      <iframe id="page2Frame" class="page2-iframe" title="小狗" style="width:100%;max-width:none;height:calc(100vh - 92px);min-height:820px;border:0;border-radius:0;display:block;background:#f4f5f7;"></iframe>
    </section>

    <section id="tab-page3" class="panel">
      <div class="empty-box">
        敬请期待
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://pqraknjtxyruvswgrlwg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FcGKft63Ke2d0pnaXSoS7Q_4W1chpvp";

    const MESSAGES_API_URL = `${SUPABASE_URL}/rest/v1/messages`;
    const ROBOT_STATUS_API_URL = `${SUPABASE_URL}/rest/v1/robot_status?id=eq.main&select=*`;

    // 超过这个秒数没更新，就视为机器人离线。
    const ROBOT_OFFLINE_SECONDS = 15;

    let messages = [];

    const statusTextMap = {
      waiting: "等待中",
      processing: "处理中",
      done: "作帐完成",
      error: "发生错误"
    };

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const tab = button.dataset.tab;

        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove("active");
        });

        document.querySelectorAll(".panel").forEach((panel) => {
          panel.classList.remove("active");
        });

        button.classList.add("active");
        document.getElementById(`tab-${tab}`).classList.add("active");

        if (tab === "page2") {
          document.body.classList.add("dog-page-active");
        } else {
          document.body.classList.remove("dog-page-active");
        }
      });
    });

    document.getElementById("messageInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text) {
        showStatus("请输入内容后再送出。");
        return;
      }

      const message = {
        id: createMessageId(),
        text: text,
        status: "waiting",
        createdAt: Date.now(),
        completedAt: null,
        errorMessage: ""
      };

      input.value = "";

      try {
        await saveMessageToServer(message);
        await loadMessages();
        showStatus("已新增讯息，状态：等待中。");
      } catch (error) {
        console.error(error);
        showStatus("新增失败，请检查 Supabase 连线。", 5000);
      }
    }

    async function saveMessageToServer(message) {
      const response = await fetch(MESSAGES_API_URL, {
        method: "POST",
        headers: getSupabaseHeaders({ preferReturn: true }),
        body: JSON.stringify(toDatabaseMessage(message))
      });

      if (!response.ok) {
        const errorText = await response.text();
        console.error(errorText);
        throw new Error("新增讯息到 Supabase 失败");
      }
    }

    async function loadMessages() {
      try {
        const response = await fetch(`${MESSAGES_API_URL}?select=*&order=created_at.asc`, {
          method: "GET",
          headers: getSupabaseHeaders()
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          throw new Error("读取 Supabase 讯息失败");
        }

        const rows = await response.json();
        messages = rows.map(fromDatabaseMessage);
        renderMessages();
      } catch (error) {
        console.error(error);
        showStatus("无法读取云端资料，请检查 Supabase 设定。", 5000);
      }
    }

    function renderMessages() {
      const chatWindow = document.getElementById("chatWindow");
      chatWindow.innerHTML = "";

      if (messages.length === 0) {
        chatWindow.innerHTML = `
          <div class="empty-chat">
            目前没有对话内容<br />
            请在下方输入后按送出
          </div>
        `;
        return;
      }

      messages.forEach((message) => {
        const card = document.createElement("div");
        card.className = "message-card";
        card.dataset.messageId = message.id;

        const header = document.createElement("div");
        header.className = "message-header";

        const id = document.createElement("div");
        id.className = "message-id";
        id.textContent = `ID：${message.id}`;

        const time = document.createElement("div");
        time.className = "message-time";
        time.textContent = `建立时间：${formatTime(message.createdAt)}`;

        header.appendChild(id);
        header.appendChild(time);

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.text;

        const badge = document.createElement("div");
        badge.className = `status-badge status-${message.status}`;

        if (message.status === "done") {
          const shortSummary = getShortSummary(message.errorMessage);
          badge.textContent = shortSummary
            ? `作帐完成：\n${shortSummary}`
            : `作帐完成：\n${formatTime(message.completedAt)}`;
        } else if (message.status === "error") {
          badge.textContent = `${statusTextMap[message.status]}：${message.errorMessage || "未提供错误原因"}`;
        } else if (message.status === "processing") {
          badge.textContent = message.errorMessage || "处理中";
        } else {
          badge.textContent = statusTextMap[message.status] || message.status;
        }

        const statusRow = document.createElement("div");
        statusRow.className = "message-status-row";
        statusRow.appendChild(badge);

        card.appendChild(header);
        card.appendChild(text);
        card.appendChild(statusRow);

        chatWindow.appendChild(card);
      });

      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function clearMessages() {
      if (!confirm("确定要清空全部对话吗？\n\n清空后 Supabase 云端资料也会被删除。")) {
        return;
      }

      try {
        const response = await fetch(`${MESSAGES_API_URL}?id=not.is.null`, {
          method: "DELETE",
          headers: getSupabaseHeaders()
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          throw new Error("清空 Supabase 讯息失败");
        }

        messages = [];
        renderMessages();
        showStatus("已清空对话。");
      } catch (error) {
        console.error(error);
        showStatus("清空失败，请检查 Supabase 连线。", 5000);
      }
    }

    async function checkRobotStatus() {
      try {
        const response = await fetch(ROBOT_STATUS_API_URL, {
          method: "GET",
          headers: getSupabaseHeaders(),
          cache: "no-store"
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          throw new Error("读取机器人状态失败");
        }

        const rows = await response.json();

        if (!rows || rows.length === 0) {
          throw new Error("找不到机器人状态资料");
        }

        const row = rows[0];

        setRobotStatus({
          online: row.online,
          status: row.status,
          lastHeartbeat: row.last_heartbeat
        });

      } catch (error) {
        console.error(error);

        setRobotStatus({
          online: false,
          status: "无法读取机器人状态。",
          lastHeartbeat: 0
        });
      }
    }

    function setRobotStatus(statusData) {
      const dot = document.getElementById("robotStatusDot");
      const text = document.getElementById("robotStatusText");
      const detail = document.getElementById("robotStatusDetail");

      dot.classList.remove("online", "offline");

      const now = Date.now();
      const lastHeartbeat = statusData.lastHeartbeat || 0;
      const secondsSinceHeartbeat = Math.floor((now - lastHeartbeat) / 1000);
      const isFresh = secondsSinceHeartbeat <= ROBOT_OFFLINE_SECONDS;

      if (statusData.online === true && isFresh) {
        dot.classList.add("online");
        text.textContent = "小猪：在线";
        detail.textContent = `目前状态：${statusData.status || "待命中"}｜最后回报：${formatTime(lastHeartbeat)}`;
        return;
      }

      dot.classList.add("offline");
      text.textContent = "小猪：离线";

      if (lastHeartbeat) {
        detail.textContent = `超过 ${ROBOT_OFFLINE_SECONDS} 秒没有收到机器人回报，最后回报：${formatTime(lastHeartbeat)}`;
      } else {
        detail.textContent = statusData.status || "尚未收到机器人上线回报。";
      }
    }

    function showStatus(message, duration = 3500) {
      const status = document.getElementById("page1Status");
      status.textContent = message;

      setTimeout(() => {
        status.textContent = "";
      }, duration);
    }

    function createMessageId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return "msg_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    function formatTime(timestamp) {
      if (!timestamp) {
        return "无";
      }

      return new Date(timestamp).toLocaleString();
    }

    function getShortSummary(summaryText) {
      if (!summaryText) {
        return "";
      }

      const lines = summaryText
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean);

      const resultLines = [];

      for (const line of lines) {
        if (/^第\d+笔\s+/.test(line)) {
          resultLines.push(line);
          continue;
        }

        break;
      }

      if (resultLines.length > 0) {
        return resultLines.join("\n");
      }

      return lines[0] || "";
    }

    function getSupabaseHeaders(options = {}) {
      const headers = {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      };

      if (options.preferReturn) {
        headers.Prefer = "return=representation";
      }

      return headers;
    }

    function toDatabaseMessage(message) {
      return {
        id: message.id,
        text: message.text,
        status: message.status,
        created_at: message.createdAt,
        completed_at: message.completedAt,
        error_message: message.errorMessage || ""
      };
    }

    function fromDatabaseMessage(row) {
      return {
        id: row.id,
        text: row.text,
        status: row.status,
        createdAt: row.created_at,
        completedAt: row.completed_at,
        errorMessage: row.error_message || ""
      };
    }

    loadMessages();
    checkRobotStatus();

    setInterval(checkRobotStatus, 3000);
    setInterval(loadMessages, 5000);

    function decodePage2Html(base64Text) {
      const binary = atob(base64Text);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }

      return new TextDecoder("utf-8").decode(bytes);
    }

    const page2Frame = document.getElementById("page2Frame");

    if (page2Frame) {
      page2Frame.srcdoc = decodePage2Html(PAGE2_HTML_BASE64);
    }
  </script>
